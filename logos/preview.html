<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>留幅 STILLFOLIO · Logo Refinement</title>
  <style>
    :root{--bg:#e4e1d9;--paper:#f5f3ed;--ink:#201f1b;--muted:#827d72;--line:#cbc6bb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Helvetica Neue","Noto Sans SC",Arial,sans-serif}body.dark{--bg:#171714;--paper:#24231f;--ink:#f5f3ed;--muted:#a8a296;--line:#44423b}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:2rem;padding:clamp(28px,5vw,72px)}.eyebrow{color:var(--muted);font-size:11px;letter-spacing:.22em}.top h1{margin:14px 0 8px;font-family:"Songti SC","Noto Serif CJK SC",serif;font-size:clamp(40px,7vw,88px);font-weight:500;line-height:1}.top p{max-width:580px;margin:0;color:var(--muted);line-height:1.8}.toggle{border:1px solid var(--line);padding:.7rem 1rem;background:transparent;color:var(--ink);cursor:pointer}.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(260px,.7fr);gap:1px;background:var(--line);border-block:1px solid var(--line)}.card,.sizes{background:var(--paper);padding:clamp(28px,5vw,64px)}.card-img{height:360px;display:flex;align-items:center}.card-img img{display:block;width:100%;max-height:300px}.label{border-top:1px solid var(--line);padding-top:22px}.label strong{display:block;margin-bottom:8px;font-weight:500}.label span{color:var(--muted);font-size:13px;line-height:1.7}.sizes h2{margin:0 0 34px;font-size:14px;font-weight:500;letter-spacing:.08em}.size-row{display:grid;grid-template-columns:48px 1fr;align-items:center;gap:20px;margin:0 0 28px;color:var(--muted);font-size:12px}.size-row div{height:84px;display:flex;align-items:center}.size-row img{display:block}.mark-note{margin-top:36px;border-top:1px solid var(--line);padding-top:22px;color:var(--muted);font-size:13px;line-height:1.8}footer{padding:28px clamp(28px,5vw,72px);color:var(--muted);font-size:11px;letter-spacing:.12em}@media(max-width:760px){.grid{grid-template-columns:1fr}.top{align-items:flex-start}.card-img{height:230px}.toggle{white-space:nowrap}}
  </style>
</head>
<body>
  <header class="top"><div><div class="eyebrow">SELECTED DIRECTION · ITERATION 01</div><h1>留幅 <span style="font-family:Helvetica Neue,Arial,sans-serif;font-size:.3em;letter-spacing:.12em">STILLFOLIO</span></h1><p>取景框确定画面边界，曲线保留风景的呼吸，坐标点连接每张照片背后的地点。整体延续产品克制、安静的编辑感。</p></div><button class="toggle" type="button">明暗背景</button></header>
  <main class="grid">
    <section class="card"><div class="card-img"><img src="iterations/iteration-1.svg" alt="留幅 STILLFOLIO 正式组合标"></div><div class="label"><strong>坐标取景器 · 正式组合标</strong><span>用于网页导航、品牌介绍和作品集布局研究页。JYONN 继续作为摄影者自己的导出署名。</span></div></section>
    <aside class="sizes"><h2>FAVICON SIZE CHECK</h2><div class="size-row"><span>64 PX</span><div><img src="../src/assets/stillfolio-mark.svg" width="64" height="64" alt="64像素图标"></div></div><div class="size-row"><span>32 PX</span><div><img src="../src/assets/stillfolio-mark.svg" width="32" height="32" alt="32像素图标"></div></div><div class="size-row"><span>16 PX</span><div><img src="../src/assets/stillfolio-mark.svg" width="16" height="16" alt="16像素图标"></div></div><p class="mark-note">小尺寸版本加粗了取景框和风景线，并移除文字，使浏览器标签和紧凑工具栏中仍能保持辨识度。</p></aside>
  </main>
  <footer>SVG MASTER ARTWORK · ITERATION 01 · 2026</footer>
  <script>document.querySelector('.toggle').addEventListener('click',()=>document.body.classList.toggle('dark'));</script>
</body>
</html>
