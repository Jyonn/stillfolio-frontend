<head>

  <title>申请高德 Web Service Key · 留幅</title>
  <link rel="stylesheet" href="./help.css">

<body>
  <main>
    <a class="back" href="/">← 返回留幅</a>
    <p class="eyebrow">AMAP WEB SERVICE</p>
    <h1>申请高德地理编码 Key</h1>
    <p class="lead">用于把照片中的经纬度解析为中文位置。Key 只保存在你的浏览器。</p>
    <ol>
      <li><span>01</span><div><h2>注册开发者</h2><p>前往高德开放平台，登录后完成开发者认证。</p></div></li>
      <li><span>02</span><div><h2>创建应用</h2><p>在控制台中新建应用，名称可以填写“留幅”。</p></div></li>
      <li><span>03</span><div><h2>添加 Web 服务 Key</h2><p>服务平台请选择“Web 服务”，复制生成的 Key。</p></div></li>
      <li><span>04</span><div><h2>回到留幅</h2><p>把 Key 粘贴到首次设置或用户设置中的地理解析服务。</p></div></li>
    </ol>
    <a class="external" href="https://console.amap.com/dev/index" target="_blank" rel="noopener">打开高德开放平台 ↗</a>
  </main>
</body>
